name: IslandTray
options:
  bundleIdPrefix: com.pikare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release
  Free-Debug: debug
  Free-Release: release

settings:
  base:
    # The one place the version is set; every Info.plist reads these.
    MARKETING_VERSION: "1.1.2"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  IslandTray:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/App
      - path: Resources/App/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localization/en.lproj
        buildPhase: resources
      - path: Resources/Localization/ja.lproj
        buildPhase: resources
      - path: Resources/Shortcuts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pikare.islandtray
        INFOPLIST_FILE: Resources/App/Info.plist
      configs:
        Debug:        { CODE_SIGN_ENTITLEMENTS: Entitlements/Paid/App.entitlements }
        Release:      { CODE_SIGN_ENTITLEMENTS: Entitlements/Paid/App.entitlements }
        Free-Debug:   { CODE_SIGN_ENTITLEMENTS: Entitlements/Free/App.entitlements }
        Free-Release: { CODE_SIGN_ENTITLEMENTS: Entitlements/Free/App.entitlements }
    dependencies:
      - target: IslandTrayWidget
      - target: IslandTrayShare

  IslandTrayWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/Widget
      - path: Resources/Localization/en.lproj
        buildPhase: resources
      - path: Resources/Localization/ja.lproj
        buildPhase: resources
      # The island's page buttons construct this intent, so the widget has
      # to know the type. Its `perform()` only ever runs in the app -- a
      # LiveActivityIntent is launched into the app's process -- but it still
      # has to compile here, which is what the two files under it are for.
      - path: Sources/App/TrayPageIntent.swift
      - path: Sources/App/TrayActivityController.swift
      - path: Sources/App/ThumbnailService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pikare.islandtray.widget
        INFOPLIST_FILE: Resources/Widget/Info.plist
      configs:
        Debug:        { CODE_SIGN_ENTITLEMENTS: Entitlements/Paid/Widget.entitlements }
        Release:      { CODE_SIGN_ENTITLEMENTS: Entitlements/Paid/Widget.entitlements }
        Free-Debug:   { CODE_SIGN_ENTITLEMENTS: Entitlements/Free/Widget.entitlements }
        Free-Release: { CODE_SIGN_ENTITLEMENTS: Entitlements/Free/Widget.entitlements }

  IslandTrayShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/Share
      # The share sheet ingests NSItemProviders exactly as a drop does --
      # same type-identifier selection, same staging, same failure counting.
      # Compiled in rather than copied, so the two can never diverge. The
      # rest of Sources/App is not pulled in: this is a single file.
      - path: Sources/App/DropReceiver.swift
      - path: Resources/Localization/en.lproj
        buildPhase: resources
      - path: Resources/Localization/ja.lproj
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pikare.islandtray.share
        INFOPLIST_FILE: Resources/Share/Info.plist
      configs:
        Debug:        { CODE_SIGN_ENTITLEMENTS: Entitlements/Paid/Share.entitlements }
        Release:      { CODE_SIGN_ENTITLEMENTS: Entitlements/Paid/Share.entitlements }
        Free-Debug:   { CODE_SIGN_ENTITLEMENTS: Entitlements/Free/Share.entitlements }
        Free-Release: { CODE_SIGN_ENTITLEMENTS: Entitlements/Free/Share.entitlements }

  IslandTrayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        # Base GENERATE_INFOPLIST_FILE: NO assumes a checked-in Info.plist (see other
        # targets' INFOPLIST_FILE), but a unit test bundle doesn't need a custom one.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: IslandTray

schemes:
  IslandTray:
    build:
      targets: { IslandTray: all }
    run: { config: Debug }
    test: { config: Debug, targets: [IslandTrayTests] }
    archive: { config: Release }
  IslandTray (Free):
    build:
      targets: { IslandTray: all }
    run: { config: Free-Debug }
    test: { config: Free-Debug, targets: [IslandTrayTests] }
    archive: { config: Free-Release }
